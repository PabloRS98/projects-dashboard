<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0d12">
    <title>{% block title %}Dashboard de Proyectos{% endblock %}</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/htmx.min.js" defer></script>
</head>
<body>
{% from "_icons.html" import icon %}
<header class="topbar">
    <a href="/" class="brand">{{ icon("folder-git-2", 20) }} <span>Proyectos</span></a>
    <nav class="nav-links">
        {% set ruta = request.url.path %}
        <a href="/" class="{{ 'active' if ruta == '/' else '' }}">{{ icon("layout-dashboard") }}<span>Dashboard</span></a>
        <a href="/tv" class="{{ 'active' if ruta == '/tv' else '' }}">{{ icon("tv") }}<span>Panel</span></a>
        <a href="/estado" class="{{ 'active' if ruta == '/estado' else '' }}">{{ icon("activity") }}<span>Estado</span></a>
    </nav>
</header>
<main class="container">
    {% block content %}{% endblock %}
</main>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
