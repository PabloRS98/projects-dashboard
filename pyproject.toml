[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["app/static"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
]
ignore = [
    "B008",   # Depends(...) como valor por defecto es el idioma de FastAPI
    "UP031",  # el formato con % es el estilo consistente del proyecto
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
