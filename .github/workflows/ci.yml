name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Linter
        run: ruff check .

      - name: Tests
        # Las pruebas del escáner crean repos git de verdad, así que necesitan
        # una identidad configurada.
        run: |
          git config --global user.email "ci@ejemplo.tld"
          git config --global user.name "CI"
          pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t projects-dashboard:ci .
