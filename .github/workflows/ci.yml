name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        # Scanner tests create real git repositories and require a configured git identity.
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Dependencies are pinned; pip-audit flags newly disclosed CVEs (especially nh3).
      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t projects-dashboard:ci .

      # Smoke-test container startup against real endpoints.
      - name: Start container and check health
        run: |
          docker run -d --name pd-ci -e DB_PATH=/tmp/ci.db -e ENABLE_AUTH=false \
            -p 8000:8000 projects-dashboard:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/salud > /dev/null; then
              echo "started on attempt $attempt"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/salud

      - name: Check core routes
        run: |
          for route in / /lista /estado /tv /salud; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000$route")
            echo "$route -> $code"
            [ "$code" = "200" ] || exit 1
          done

      - name: Verify non-root process
        # Read PID 1 UID (uvicorn); `docker exec ... id -u` would inspect the exec shell instead.
        run: |
          uid=$(docker exec pd-ci awk '/^Uid:/ {print $2}' /proc/1/status)
          echo "main process uid: $uid"
          [ "$uid" != "0" ] || exit 1

      - name: Container logs
        if: always()
        run: docker logs pd-ci || true
