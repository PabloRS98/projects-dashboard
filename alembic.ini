# Configuración de Alembic.
#
# La URL de la base NO va aquí: la pone `app/database.py` al construir la
# configuración en memoria, a partir de `DB_PATH`. Así el fichero no depende del
# entorno y la app y las migraciones no pueden apuntar a bases distintas.
[alembic]
script_location = migraciones

# El logging lo configura la app (`logging.basicConfig` en main.py). Alembic
# tiene su propia sección [loggers] por defecto que la pisaría, así que aquí se
# omite a propósito.
